<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas · Centro de Clases Paute</title>
  <style>
    :root { --azul: #1f4e8c; --fondo: #f4f6fa; --borde: #d5dbe5; --ok: #1b7f4b; --mal: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--fondo); color: #1c2430; }
    header { background: var(--azul); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 900px) { main { grid-template-columns: 2fr 1fr; } }
    section { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 16px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-size: 13px; margin-top: 8px; }
    input, select, button, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--borde); border-radius: 6px; width: 100%; }
    button { background: var(--azul); color: #fff; border: 0; cursor: pointer; width: auto; margin-top: 10px; }
    button.sec { background: #e8edf5; color: #1c2430; }
    .fila { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--borde); vertical-align: top; }
    td button { margin: 2px; padding: 3px 8px; font-size: 13px; }
    .estado { padding: 1px 8px; border-radius: 99px; font-size: 12px; background: #e8edf5; }
    .estado.confirmada { background: #d7f0e2; color: var(--ok); }
    .estado.cancelada { background: #f7dcda; color: var(--mal); }
    #eventos { list-style: none; padding: 0; margin: 0; max-height: 420px; overflow: auto; font-size: 13px; }
    #eventos li { border-left: 3px solid var(--azul); padding: 4px 8px; margin-bottom: 6px; background: #f7f9fc; }
    #msg { min-height: 1.5em; font-size: 14px; }
    #msg.error { color: var(--mal); } #msg.ok { color: var(--ok); }
    .oculto { display: none; }
  </style>
</head>
<body>
<header>
  <h1>Reservas · Centro de Clases Paute</h1>
  <div id="quien">Sin sesión</div>
</header>
<main>
  <div style="display:grid;gap:16px">
    <section id="secLogin">
      <h2>Iniciar sesión</h2>
      <form id="fLogin" class="fila">
        <div><label for="email">Correo</label><input id="email" type="email" value="maria@correo.com" required></div>
        <div><label for="pass">Contraseña</label><input id="pass" type="password" value="Maria123!" required></div>
        <div><button>Entrar</button></div>
      </form>
      <p style="font-size:13px">Demo: <code>admin@tejiendoredes.ec / Admin123!</code> · <code>maria@correo.com / Maria123!</code></p>
    </section>

    <section id="secReserva" class="oculto">
      <h2>Nueva reserva</h2>
      <form id="fReserva">
        <div class="fila">
          <div><label for="servicio">Servicio</label><select id="servicio" required></select></div>
          <div><label for="estudiante">Estudiante</label><input id="estudiante" required minlength="2"></div>
          <div><label for="fecha">Fecha</label><input id="fecha" type="date" required></div>
          <div><label for="hora">Hora inicio</label><input id="hora" type="time" value="15:00" required></div>
          <div><label for="duracion">Duración</label>
            <select id="duracion"><option value="60">60 min</option><option value="90">90 min</option><option value="120">120 min</option></select></div>
        </div>
        <label for="notas">Notas</label><textarea id="notas" rows="2" maxlength="500"></textarea>
        <button>Reservar</button>
      </form>
    </section>

    <section id="secLista" class="oculto">
      <h2>Reservas <button class="sec" id="btnRecargar" type="button">Recargar</button> <button class="sec" id="btnSalir" type="button">Cerrar sesión</button></h2>
      <p id="msg" role="status" aria-live="polite"></p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>#</th><th>Estudiante</th><th>Servicio</th><th>Fecha</th><th>Horario</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="tabla"></tbody>
      </table></div>
    </section>
  </div>

  <section>
    <h2>Notificaciones en tiempo real</h2>
    <ul id="eventos"><li>Inicie sesión para conectarse.</li></ul>
  </section>
</main>
<input type="file" id="archivo" accept=".pdf,.png,.jpg,.jpeg" class="oculto">

<script src="/socket.io/socket.io.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  let usuario = null, socket = null, reservaParaArchivo = null;

  async function api(metodo, url, cuerpo) {
    const opciones = { method: metodo, headers: {} };
    if (cuerpo instanceof FormData) opciones.body = cuerpo;
    else if (cuerpo) { opciones.headers['Content-Type'] = 'application/json'; opciones.body = JSON.stringify(cuerpo); }
    const res = await fetch(url, opciones);
    const datos = res.status === 204 ? null : await res.json();
    if (!res.ok) {
      const det = datos.error.details ? ' ' + datos.error.details.map((d) => d.campo ? `${d.campo}: ${d.mensaje}` : JSON.stringify(d)).join('; ') : '';
      throw new Error(`${res.status} ${datos.error.code} — ${datos.error.message}${det}`);
    }
    return datos;
  }

  const mensaje = (texto, tipo = 'ok') => { $('#msg').textContent = texto; $('#msg').className = tipo; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function mostrarSesion() {
    $('#quien').textContent = usuario ? `${usuario.nombre} (${usuario.rol})` : 'Sin sesión';
    $('#secLogin').classList.toggle('oculto', !!usuario);
    $('#secReserva').classList.toggle('oculto', !usuario);
    $('#secLista').classList.toggle('oculto', !usuario);
  }

  function conectarSocket() {
    socket?.disconnect();
    socket = io();
    $('#eventos').innerHTML = '';
    const agregar = (texto) => {
      const li = document.createElement('li');
      li.textContent = `${new Date().toLocaleTimeString()} · ${texto}`;
      $('#eventos').prepend(li);
    };
    socket.on('bienvenida', (m) => agregar(m.mensaje));
    socket.on('connect_error', (e) => agregar('Error de conexión: ' + e.message));
    ['reserva:creada', 'reserva:actualizada', 'reserva:comprobante'].forEach((ev) =>
      socket.on(ev, ({ datos: r }) => { agregar(`${ev} → #${r.id} ${r.estudianteNombre} ${r.fecha} ${r.horaInicio} [${r.estado}]`); cargarReservas(); }));
    socket.on('reserva:eliminada', ({ datos }) => { agregar(`reserva:eliminada → #${datos.id}`); cargarReservas(); });
    ['servicio:creado', 'servicio:actualizado', 'servicio:eliminado'].forEach((ev) =>
      socket.on(ev, ({ datos }) => { agregar(`${ev} → ${datos.nombre ?? '#' + datos.id}`); cargarServicios(); }));
  }

  async function cargarServicios() {
    const { data } = await api('GET', '/api/servicios');
    $('#servicio').innerHTML = data.map((s) => `<option value="${s.id}">${esc(s.nombre)} · $${s.precio}/h · cupo ${s.cupo}</option>`).join('');
  }

  async function cargarReservas() {
    const { data, meta } = await api('GET', '/api/reservas?limit=100');
    $('#tabla').innerHTML = data.map((r) => `
      <tr>
        <td>${r.id}</td><td>${esc(r.estudianteNombre)}</td><td>${esc(r.servicio.nombre)}</td>
        <td>${r.fecha}</td><td>${r.horaInicio}–${r.horaFin}</td>
        <td><span class="estado ${r.estado}">${r.estado}</span>${r.tieneComprobante ? ' 📎' : ''}</td>
        <td>
          ${usuario.rol === 'admin' && r.estado === 'pendiente' ? `<button data-acc="confirmar" data-id="${r.id}" data-v="${r.version}">Confirmar</button>` : ''}
          ${r.estado !== 'cancelada' ? `<button class="sec" data-acc="cancelar" data-id="${r.id}" data-v="${r.version}">Cancelar</button>` : ''}
          ${r.estado !== 'cancelada' ? `<button class="sec" data-acc="subir" data-id="${r.id}">Comprobante</button>` : ''}
          ${r.tieneComprobante ? `<a href="/api/reservas/${r.id}/comprobante" target="_blank" rel="noopener">Ver</a>` : ''}
        </td>
      </tr>`).join('') || '<tr><td colspan="7">Sin reservas.</td></tr>';
    if (!$('#msg').textContent) mensaje(`${meta.total} reserva(s).`);
  }

  $('#fLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      ({ data: usuario } = await api('POST', '/api/auth/login', { email: $('#email').value, password: $('#pass').value }));
      mostrarSesion(); conectarSocket(); await cargarServicios(); await cargarReservas();
    } catch (err) { alert(err.message); }
  });

  $('#fReserva').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const { data } = await api('POST', '/api/reservas', {
        servicioId: Number($('#servicio').value), estudianteNombre: $('#estudiante').value,
        fecha: $('#fecha').value, horaInicio: $('#hora').value, duracionMin: Number($('#duracion').value),
        ...($('#notas').value ? { notas: $('#notas').value } : {}),
      });
      mensaje(`Reserva #${data.id} creada.`);
    } catch (err) { mensaje(err.message, 'error'); }
  });

  $('#tabla').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const id = b.dataset.id, version = Number(b.dataset.v);
    try {
      if (b.dataset.acc === 'subir') { reservaParaArchivo = id; $('#archivo').click(); return; }
      const estado = b.dataset.acc === 'confirmar' ? 'confirmada' : 'cancelada';
      await api('PATCH', `/api/reservas/${id}`, { version, estado });
      mensaje(`Reserva #${id} ${estado}.`);
    } catch (err) { mensaje(err.message, 'error'); }
  });

  $('#archivo').addEventListener('change', async () => {
    const f = $('#archivo').files[0]; if (!f) return;
    const fd = new FormData(); fd.append('comprobante', f);
    try { await api('PUT', `/api/reservas/${reservaParaArchivo}/comprobante`, fd); mensaje('Comprobante subido.'); }
    catch (err) { mensaje(err.message, 'error'); }
    $('#archivo').value = '';
  });

  $('#btnRecargar').addEventListener('click', () => cargarReservas().catch((e) => mensaje(e.message, 'error')));
  $('#btnSalir').addEventListener('click', async () => {
    await api('POST', '/api/auth/logout'); usuario = null; socket?.disconnect(); mostrarSesion();
    $('#eventos').innerHTML = '<li>Sesión cerrada.</li>';
  });

  // Restaurar sesión existente (la cookie sobrevive a recargas y reinicios del servidor)
  (async () => {
    const manana = new Date(Date.now() + 864e5); $('#fecha').value = manana.toISOString().slice(0, 10);
    try { ({ data: usuario } = await api('GET', '/api/auth/me')); mostrarSesion(); conectarSocket(); await cargarServicios(); await cargarReservas(); }
    catch { mostrarSesion(); }
  })();
</script>
</body>
</html>
